services:
  sqm-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sqm-backend
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      SQM_ENV: "production"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  sqm-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sqm-worker
    command: python tools/cleanup_audit_job.py
    environment:
      PYTHONUNBUFFERED: "1"
      SQM_ENV: "production"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

<div class="app-body">

  <!-- 사이드바 9탭 (v864.2 structure.json 순서 준수) -->
  <aside class="sidebar" id="sidebar">
    <button class="side-btn" data-route="inventory"><span class="side-icon">📦</span><span class="side-label">Inventory</span></button>
    <button class="side-btn" data-route="allocation"><span class="side-icon">📋</span><span class="side-label">Allocation</span></button>
    <button class="side-btn" data-route="picked"><span class="side-icon">🚛</span><span class="side-label">Picked</span></button>
    <button class="side-btn" data-route="outbound"><span class="side-icon">📤</span><span class="side-label">Outbound</span></button>
    <button class="side-btn" data-route="return"><span class="side-icon">🔄</span><span class="side-label">Return</span></button>
    <button class="side-btn" data-route="move"><span class="side-icon">🔀</span><span class="side-label">Move</span></button>
    <button class="side-btn active" data-route="dashboard"><span class="side-icon">📊</span><span class="side-label">Dashboard</span></button>
    <button class="side-btn" data-route="log"><span class="side-icon">📝</span><span class="side-label">Log</span></button>
    <button class="side-btn" data-route="scan"><span class="side-icon">📷</span><span class="side-label">Scan</span></button>
  </aside>

  <!-- 메인 컨텐츠 영역 -->
  <div class="main-wrapper">

    <!-- 우측 단위 라디오 (돈백/LOT/MT) -->
    <div class="view-toggle">
      <label><input type="radio" name="view-unit" value="tonbag"> 🎒 돈백</label>
      <label><input type="radio" name="view-unit" value="lot"> 📦 LOT</label>
      <label><input type="radio" name="view-unit" value="mt" checked> 📊 MT</label>
    </div>

    <!-- 대시보드 전용 컨테이너 (renderPage가 건드리지 않음) -->
    <div id="dashboard-container" class="page-content">
      <div id="kpi-row" class="kpi-row">
        <div class="kpi-card" id="kpi-inbound">
          <div class="kpi-icon">📥</div>
          <div class="kpi-label">오늘 입고 (MT)</div>
          <div class="kpi-value" id="kpi-inbound-val">--</div>
        </div>
        <div class="kpi-card" id="kpi-outbound-today">
          <div class="kpi-icon">📤</div>
          <div class="kpi-label">오늘 출고 (MT)</div>
          <div class="kpi-value" id="kpi-outbound-today-val">--</div>
        </div>
        <div class="kpi-card" id="kpi-stock-lots">
          <div class="kpi-icon">📦</div>
          <div class="kpi-label">현재 재고 LOT</div>
          <div class="kpi-value" id="kpi-stock-lots-val">--</div>
        </div>
        <div class="kpi-card" id="kpi-unassigned">
          <div class="kpi-icon">📍</div>
          <div class="kpi-label">위치 미배정</div>
          <div class="kpi-value" id="kpi-unassigned-val">--</div>
        </div>
      </div>
      <div id="dashboard-detail" style="padding:8px 16px;"></div>
    </div>
    <!-- 페이지 컨텐츠 (사이드바 탭 전환용 — dashboard 전환 시 숨김) -->
    <div id="page-container" class="page-content" style="display:none;"></div>

  </div><!-- /.main-wrapper -->

</div><!-- /.app-body -->

<!-- ALERTS 패널 -->

</div>

  <span class="status-sep">|</span>
  <span id="status-db">DB --</span>
  <span class="status-sep">|</span>
  <span id="status-version">v8.6.4.3</span>

</footer>

name: SQM Release Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to verify, e.g. v9.0.7.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-gate:
    name: Verify release readiness
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check release version
        run: python scripts\check_release_version.py --release "${{ inputs.release_tag }}"

      - name: Compile release gate script
        run: python -m py_compile scripts\check_release_version.py

      - name: Run regression tests
        run: python -m pytest tests/ -q
# SQM v7.0.0-alpha — Docker Compose
# ====================================
# 사용법:
#   docker-compose up -d        # 시작
#   docker-compose down          # 중지
#   docker-compose logs -f       # 로그 확인

version: "3.8"

services:
  sqm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sqm-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - sqm_data:/app/data          # DB + 감사 로그 + 백업
      - ./config_email.json:/app/config_email.json:ro  # 이메일 설정 (선택)
    environment:
      - SQM_JWT_SECRET=${SQM_JWT_SECRET:-sqm-prod-secret-2026}
      - SQM_TOKEN_EXPIRY=${SQM_TOKEN_EXPIRY:-86400}
      - SQM_RATE_LIMIT=${SQM_RATE_LIMIT:-120/minute}
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqm_data:
    driver: local

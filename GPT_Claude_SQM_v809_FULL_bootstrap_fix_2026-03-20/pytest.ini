[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 기본 옵션
addopts =
    --tb=short
    -q
    --strict-markers

# 커스텀 마커
markers =
    slow: 시간이 오래 걸리는 테스트
    carrier: BL 선사 탐지/파싱 테스트 (bl_carrier_registry)
    api: FastAPI 의존 테스트 (fastapi/slowapi 필요)
    gui: tkinter GUI 의존 테스트
    integration: 통합 테스트 (DB + 엔진)
    outbound: 출고 상태전이 테스트
    inbound: 입고 테스트
    rollback: 트랜잭션 롤백 테스트
    edge: 엣지케이스 테스트

# 로그 설정
log_cli = false
log_cli_level = WARNING

# 경고 필터 (S3-5 보강)
filterwarnings =
    ignore::DeprecationWarning:sqlite3
    ignore::DeprecationWarning
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning:importlib
    ignore::DeprecationWarning:pkg_resources

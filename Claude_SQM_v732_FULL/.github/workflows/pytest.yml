# .github/workflows/pytest.yml
# SQM 재고관리 시스템 v7.0.0 — GitHub Actions CI
#
# 커버리지:
#   기존: 94개 (bl_carrier 20 + gemini_parser 27 + inbound_doc 15 +
#               stage1~4 12 + v660 35)
#   신규: 145개 (v700 stage1~4/validators/integrity/compat/preflight)
#   합계: ~239개 대상
#
# SKIP 허용:
#   - PDF 파일 없는 환경: T18~T20 (bl_carrier 3개)
#   - GUI/tkinter 의존 항목

name: SQM pytest CI v7.0.0

on:
  push:
    branches: [ main, develop, "release/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: pytest ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ "3.12" ]

    steps:
      # ── 1. 체크아웃 ───────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python 설정 ────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 3. 의존성 설치 ────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install pdfplumber openpyxl pandas
          pip install ttkbootstrap pillow reportlab
          pip install google-generativeai || true

      # ── 4. 환경 변수 ──────────────────────────────────────
      - name: Set environment variables
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> $GITHUB_ENV
        shell: bash
        continue-on-error: true

      # ── 5. v7.0.0 신규 테스트 145개 (핵심) ───────────────
      - name: Run v7.0.0 core tests (145 cases)
        run: |
          python -m pytest \
            tests/test_v700_stage1_tonbag_rules.py \
            tests/test_v700_stage2_weight_rules.py \
            tests/test_v700_stage3_scan_validation.py \
            tests/test_v700_stage4_integrity.py \
            tests/test_v700_validators.py \
            tests/test_v700_integrity_checker.py \
            tests/test_v700_tonbag_compat.py \
            tests/test_v700_preflight.py \
            -v --tb=short \
            --strict-markers \
            -q
        env:
          PYTHONPATH: .

      # ── 6. 전체 테스트 스위트 ─────────────────────────────
      - name: Run full test suite
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_inbound_doc_detector.py \
            --tb=short \
            -q \
            --strict-markers \
            --cov=tests \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -m "not slow and not api and not gui"
        env:
          PYTHONPATH: .


      # ── 6. APL 시나리오 + DB + 성능 테스트 ──────────────────
      - name: Run APL scenario + return + scale tests (150 cases)
        run: |
          python -m pytest \
            tests/test_v700_scenario_apl.py \
            tests/test_v700_db_insert.py \
            tests/test_v700_performance.py \
            tests/test_v700_return_flow.py \
            tests/test_v700_file_db_and_scale.py \
            -v --tb=short -q
        env:
          PYTHONPATH: .

      # ── 7. inbound_doc_detector 테스트 ────────────────────
      - name: Run inbound doc detector tests
        run: |
          python -m pytest tests/test_inbound_doc_detector.py \
            -v --tb=short
        env:
          PYTHONPATH: .
        continue-on-error: true

      # ── 8. 선사 테스트 (BL PDF 없으면 skip) ──────────────
      - name: Run carrier tests
        run: |
          python -m pytest tests/test_bl_carrier_registry.py \
            -v --tb=short -m "carrier"
        env:
          PYTHONPATH: .
        continue-on-error: true

      # ── 9. 커버리지 업로드 ────────────────────────────────
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      # ── 10. 테스트 결과 요약 ──────────────────────────────
      - name: Test summary
        if: always()
        run: |
          echo "==========================================="
          echo " SQM v7.0.0 pytest CI 결과 요약"
          echo "  OS       : ${{ matrix.os }}"
          echo "  Python   : ${{ matrix.python-version }}"
          echo "  v7.0.0 신규: 145 케이스 (Stage1~4 + validators + compat)"
          echo "  전체 목표 : 410 PASS / 6 SKIP (PDF 없는 환경)"
          echo "==========================================="
